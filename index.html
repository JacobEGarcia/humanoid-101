<script>
"use strict";
const W=1920,H=1080;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cv.width=Math.round(W*s*DPR);cv.height=Math.round(H*s*DPR);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',resize);resize();
const AMBER='#ffb000',AMBERD='#8a6400',TEAL='#4fe3c1',TEALD='#1f6a58',RED='#ff3838',WHITE='#eceae4',GRAY='#7d7d7d',GRAY2='#4a4a4e',BG='#060607';
const MONO=(s,w)=>(w||400)+' '+s+'px "SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SERIF=(s,w)=>(w||400)+' '+s+'px Georgia,"Times New Roman",serif';
function txt(s,x,y,font,color,align){g.font=font;g.fillStyle=color;g.textAlign=align||'left';g.textBaseline='alphabetic';g.fillText(s,x,y);}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1)}
function ease(x){x=clamp(x,0,1);return x*x*(3-2*x)}
function eo(x){x=clamp(x,0,1);return 1-Math.pow(1-x,3)}
function ei(x){x=clamp(x,0,1);return x*x*x}
function blink(t,hz){return ((t*hz)%1)<0.6?1:0.18}
function line(x1,y1,x2,y2,color,w){g.strokeStyle=color;g.lineWidth=w||1.4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function circle(x,y,r,color,w,fill){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}else{g.strokeStyle=color;g.lineWidth=w||1.4;g.stroke();}}
function frame(x,y,w,h,label,kanji,color){
 color=color||AMBER;const c=16;g.lineWidth=1.6;g.strokeStyle=color;g.globalAlpha=.95;g.beginPath();
 g.moveTo(x,y+c);g.lineTo(x,y);g.lineTo(x+c,y);g.moveTo(x+w-c,y);g.lineTo(x+w,y);g.lineTo(x+w,y+c);
 g.moveTo(x+w,y+h-c);g.lineTo(x+w,y+h);g.lineTo(x+w-c,y+h);g.moveTo(x+c,y+h);g.lineTo(x,y+h);g.lineTo(x,y+h-c);g.stroke();
 g.globalAlpha=.13;g.strokeRect(x+.5,y+.5,w-1,h-1);g.globalAlpha=1;
 if(label)txt(label,x+16,y+26,MONO(15,700),color);
 if(kanji)txt(kanji,x+w-16,y+30,MONO(24,600),color,'right');
}
function arrow(x1,y1,x2,y2,color,w,p){ // p = how much of the arrow is drawn 0..1
 color=color||AMBER;const dx=x2-x1,dy=y2-y1,ex=x1+dx*clamp(p==null?1:p,0,1),ey=y1+dy*clamp(p==null?1:p,0,1);
 line(x1,y1,ex,ey,color,w||2);
 if(p==null||p>=1){const a=Math.atan2(dy,dx),s=12;g.fillStyle=color;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex-s*Math.cos(a-.45),ey-s*Math.sin(a-.45));g.lineTo(ex-s*Math.cos(a+.45),ey-s*Math.sin(a+.45));g.closePath();g.fill();}
}
const noise=document.createElement('canvas');noise.width=noise.height=128;
{const nx=noise.getContext('2d');const id=nx.createImageData(128,128);for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}nx.putImageData(id,0,0);}
const TOTAL=0;
function fmtT(s){s=Math.max(0,s|0);return String((s/60)|0)+':'+String(s%60).padStart(2,'0')}
let DUR=0;
function chrome(sc,idx,st,gt){
 const vg=g.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,H*1.0);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 g.globalAlpha=.045;g.fillStyle='#000';for(let y=0;y<H;y+=4)g.fillRect(0,y,W,1);g.globalAlpha=1;
 g.globalAlpha=.026;const ox=(Math.random()*128)|0,oy=(Math.random()*128)|0;
 for(let y=-oy;y<H;y+=128)for(let x=-ox;x<W;x+=128)g.drawImage(noise,x,y);
 g.globalAlpha=1;
 if(sc.type!=='title'&&sc.type!=='end'){
  txt(sc.kanji,80,102,MONO(34,600),AMBER);
  const kw=80+g.measureText?0:0;
  txt(sc.code+'  ·  '+sc.tag,190,98,MONO(17,700),AMBER);
  line(80,118,430,118,AMBERD,1);
 }
 // top-right status
 const tc=fmtT(elapsed())+' / '+fmtT(DUR);
 txt(playing?'▶ RUN':'❚❚ HOLD',W-80,86,MONO(16,700),playing?TEAL:AMBER,'right');
 txt(tc,W-80,110,MONO(15,400),GRAY,'right');
 // caption
 if(sc.cap){txt(sc.cap,W/2,H-72,SERIF(30,400),WHITE,'center');}
 // progress
 const gp=DUR?elapsed()/DUR:0;
 g.globalAlpha=.9;line(80,H-40,W-80,H-40,GRAY2,2);
 line(80,H-40,80+(W-160)*gp,H-40,AMBER,3);
 let acc=0;for(let i=0;i<SCENES.length;i++){const x=80+(W-160)*(acc/DUR);line(x,H-46,x,H-34,GRAY,1);acc+=SCENES[i].dur;}
 g.globalAlpha=1;
 txt('SCENE '+String(idx+1).padStart(2,'0')+' / '+String(SCENES.length).padStart(2,'0'),W-80,H-52,MONO(13,600),GRAY,'right');
 // cut flash
 if(st<0.14&&idx>0){g.globalAlpha=.22*(1-st/0.14);g.drawImage(noise,0,0,W,H);g.globalAlpha=1;}
}
function hintOverlay(gt){
 if(gt>4.5)return;const a=1-seg(gt,3.4,4.5);g.globalAlpha=a*.9;
 txt('AUTOPLAY ON — SPACE pause · ← → scenes · R replay',W/2,H-130,MONO(15,600),GRAY,'center');g.globalAlpha=1;
}
let playing=true,si=0,st=0,gt=0,startAt=performance.now();
function elapsed(){let e=0;for(let i=0;i<si;i++)e+=SCENES[i].dur;return e+Math.min(st,SCENES[si].dur);}
function draw(){
 g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 g.fillStyle=BG;g.fillRect(0,0,W,H);
 const sc=SCENES[si];
 sc.draw(st,gt);
 chrome(sc,si,st,gt);
 hintOverlay(gt);
 if(!playing&&si===SCENES.length-1&&st>=SCENES[si].dur-0.01){
  if(blink(gt,1.4)>.5)txt('— REPLAY : PRESS R —',W/2,H-180,MONO(20,700),AMBER,'center');
 }
}
let last=performance.now();
function loop(now){const dt=Math.min(.06,(now-last)/1000);last=now;gt+=dt;
 if(playing){st+=dt;while(si<SCENES.length-1&&st>=SCENES[si].dur){st-=SCENES[si].dur;si++;}
  if(si===SCENES.length-1&&st>=SCENES[si].dur){st=SCENES[si].dur;playing=false;}}
 draw();requestAnimationFrame(loop);}
function go(n){si=clamp(n,0,SCENES.length-1);st=0;playing=true;}
addEventListener('keydown',e=>{
 if(e.code==='Space'){playing=!playing;e.preventDefault();}
 else if(e.key==='ArrowRight')go(si+1);
 else if(e.key==='ArrowLeft')go(si-1);
 else if(e.key==='r'||e.key==='R')go(0);
});
cv.addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(y>r.height*0.8&&x<r.width*0.18){go(si-1);return;}
 if(y>r.height*0.8&&x>r.width*0.82){go(si+1);return;}
 playing=!playing;
});

              [1260,'ACT','動作',['motor commands','torque · position','grip · step'],RED]];

 });
 arrow(600,465,700-8,465,AMBER,2.4,seg(st,2.2,3));

 g.globalAlpha=.85;
 const y2=760;
 line(1490,630,1490,y2,TEAL,2);line(1490,y2,370,y2,TEAL,2);

// ---- P02 joints / DOF ----
function jointScene(st,gt){
 // big revolute joint
 const cx=520,cy=540;
 frame(140,220,760,640,'REVOLUTE JOINT','関節',AMBER);
 const ang=Math.sin(gt*0.9)*0.9;
 circle(cx,cy,150,GRAY2,2);circle(cx,cy,110,GRAY,1.4);
 for(let i=0;i<12;i++){const a=i*Math.PI/6+gt*0.4;line(cx+110*Math.cos(a),cy+110*Math.sin(a),cx+150*Math.cos(a),cy+150*Math.sin(a),GRAY2,1);}
 g.save();g.translate(cx,cy);g.rotate(ang);
 g.fillStyle=AMBER;g.globalAlpha=.9;g.fillRect(-26,-26,52,-190);g.globalAlpha=1;
 circle(0,-200,26,AMBER,2);g.restore();
 circle(cx,cy,14,WHITE,2,WHITE);
 txt('θ = '+(ang>=0?'+':'')+(ang*57.3).toFixed(1)+'°',cx-150,cy+250,MONO(26,700),TEAL);
 // DOF counter + arm
 frame(1020,220,760,640,'DEGREES OF FREEDOM','自由度',TEAL);

 let px=1290,py=700,a=-Math.PI/2;

 for(let i=0;i<n;i++){

// ---- P05 control loop ----
function loopScene(st,gt){
 const cx=W/2,cy=560,R=290;
 const nodes=[['TARGET','目標',-90],['CONTROLLER','制御器',-18],['MOTORS','出力',54],['BODY','身体',126],['SENSORS','計測',198]];
 const nf=nodes.length;
 nodes.forEach((n,i)=>{
  const a=(n[2]-90)*Math.PI/180*1.0+(-Math.PI/2)+ i*(Math.PI*2/nf)*0; // fallback below
 });
 // manual ring positions
 const pos=nodes.map((n,i)=>{const a=-Math.PI/2+i*(Math.PI*2/nf);return [cx+R*Math.cos(a),cy+R*Math.sin(a),n];});
 const rev=eo(seg(st,1,7))*3+gt*0.25;
 pos.forEach((p,i)=>{
  const p2=pos[(i+1)%nf];
  const mx=(p[0]+p2[0])/2,my=(p[1]+p2[1])/2;
  const ox=cx+(mx-cx)*1.45,oy=cy+(my-cy)*1.45;
  g.strokeStyle=GRAY2;g.lineWidth=2;g.beginPath();g.moveTo(p[0],p[1]);g.quadraticCurveTo(ox,oy,p2[0],p2[1]);g.stroke();
  // moving packet
  const tt=(rev+i*0.2)%1;
  const qx=(1-tt)*(1-tt)*p[0]+2*(1-tt)*tt*ox+tt*tt*p2[0];
  const qy=(1-tt)*(1-tt)*p[1]+2*(1-tt)*tt*oy+tt*tt*p2[1];
  circle(qx,qy,7,AMBER,2,AMBER);
 });
 pos.forEach((p,i)=>{
  const ap=ease(seg(st,0.4+i*0.4,1+i*0.4));g.globalAlpha=ap;
  frame(p[0]-130,p[1]-44,260,88,p[2][0],'',i===1?TEAL:AMBER);
  txt(p[2][1],p[0]+118,p[1]+8,MONO(17,600),i===1?TEAL:AMBER,'right');
  g.globalAlpha=1;
 });
 const hz=Math.floor(eo(seg(st,6,10))*1000);
 txt(hz+' Hz',cx,cy+10,MONO(52,700),hz>900?TEAL:GRAY,'center');
 txt('read · compare · correct',cx,cy+52,MONO(17,500),GRAY,'center');
}

 });

// ---- P07 kinematics ----
function kinScene(st,gt){

 const t1=Math.sin(gt*0.6)*0.7-0.5,t2=1.1+Math.sin(gt*0.83)*0.6;
 const ex=cx+L1*Math.cos(t1),ey=cy+L1*Math.sin(t1);
 const hx=ex+L2*Math.cos(t1+t2),hy=ey+L2*Math.sin(t1+t2);
 frame(140,220,900,660,'FORWARD — angles in, position out','順運動学',AMBER);
 g.strokeStyle=GRAY2;g.setLineDash([4,6]);g.beginPath();g.arc(cx,cy,L1,Math.PI,0);g.stroke();g.setLineDash([]);
 line(cx,cy,ex,ey,WHITE,5);line(ex,ey,hx,hy,TEAL,5);
 circle(cx,cy,18,AMBER,2);circle(ex,ey,14,AMBER,2);circle(hx,hy,12,TEAL,2,TEAL);
 txt('θ1 '+(t1*57.3).toFixed(0)+'°',cx-60,cy+60,MONO(18,600),AMBER);
 txt('θ2 '+(t2*57.3).toFixed(0)+'°',ex+30,ey+10,MONO(18,600),AMBER);
 txt('hand = f(θ1, θ2)',560-120,250+20,MONO(19,600),GRAY);
 txt('x '+(hx-cx|0)+'  y '+(hy-cy|0),hx+40,hy,MONO(20,600),TEAL);
 // inverse: two solutions to same target
 frame(1120,220,660,660,'INVERSE — position in','逆運動学',TEAL);
 const tx=1450,ty=560;
 const D=Math.hypot(tx-1450+0, ty-760), L3=200,L4=200;
 const bx=1450,by=780;
 const d=clamp(Math.hypot(tx-bx,ty-by),1,L3+L4-1);
 const a0=Math.atan2(ty-by,tx-bx);
 const cosA=clamp((L3*L3+d*d-L4*L4)/(2*L3*d),-1,1);
 const A=Math.acos(cosA);
 [1,-1].forEach((s,i)=>{
  const ang=a0+s*A;
  const kx=bx+L3*Math.cos(ang),ky=by+L3*Math.sin(ang);
  const col=i?GRAY:AMBER;
  g.globalAlpha=i?0.5:0.95;
  line(bx,by,kx,ky,col,4);line(kx,ky,tx,ty,col,4);
  circle(kx,ky,12,col,2);g.globalAlpha=1;
 });
 circle(bx,by,16,WHITE,2);circle(tx,ty,14,RED,2);
 txt('same target — two valid poses',1450-180,860,MONO(18,500),GRAY);
 if(blink(gt,1)> .5)txt('TARGET',tx+26,ty+6,MONO(15,700),RED);
}
// ---- P08 balance / walking ----
function humanoidFig(x,y,ph,s,col){
 // ph 0..1 gait phase; s scale
 const hipY=y-150*s;
 const sw=Math.sin(ph*Math.PI*2),sw2=Math.sin(ph*Math.PI*2+Math.PI);
 const bob=Math.abs(Math.cos(ph*Math.PI*2))*8*s;
 // torso
 const lean=0.06*Math.sin(ph*Math.PI*2*2);
 line(x,hipY-bob,x+lean*40,hipY-170*s-bob,col,5*s);
 circle(x+lean*44,hipY-200*s-bob,22*s,col,2.4);
 // legs
 const leg=(phase,side)=>{
  const hx=x+side*10*s,hy=hipY-bob;
  const swg=Math.sin(phase*Math.PI*2);
  const lift=Math.max(0,Math.sin(phase*Math.PI*2))*46*s;
  const kx=hx+swg*34*s,ky=hy+95*s-lift*0.4;
  const fx=hx+swg*66*s,fy=y-lift;
  line(hx,hy,kx,ky,col,4.4*s);line(kx,ky,fx,fy,col,4.4*s);
  line(fx,fy,fx+side*26*s,fy,col,4.4*s);
  return [fx,fy];
 };
 const f1=leg(ph,1),f2=leg(ph+0.5,-1);
 // arms
 const asw=Math.sin(ph*Math.PI*2+Math.PI)*30*s;
 line(x+lean*40,hipY-150*s-bob,x+lean*40-asw,hipY-70*s-bob,col,3.6*s);
 line(x+lean*40,hipY-150*s-bob,x+lean*40+asw,hipY-70*s-bob,col,3.6*s);
 return [f1,f2,hipY];
}
function walkScene(st,gt){
 frame(140,220,1640,660,'BIPED BALANCE','歩行',AMBER);
 const ground=780;
 line(140,ground,1780,ground,GRAY2,3);
 const ph=gt*0.55;
 const x=960+Math.sin(gt*0.2)*0; // walker stays centered
 const fig=humanoidFig(x,ground,ph,1.15,WHITE);
 const f1=fig[0],f2=fig[1];
 // support polygon between feet on ground
 const g1=f1[1]>=ground-2?f1[0]:null,g2=f2[1]>=ground-2?f2[0]:null;
 let lo=Math.min(g1??1e9,g2??1e9),hi=Math.max(g1??-1e9,g2??-1e9);
 if(lo>hi){lo=Math.min(f1[0],f2[0]);hi=Math.max(f1[0],f2[0]);}
 if(lo<1e8){g.globalAlpha=.16;g.fillStyle=TEAL;g.fillRect(lo-30,ground,hi-lo+60,10);g.globalAlpha=1;
  txt('SUPPORT POLYGON',(lo+hi)/2,ground+52,MONO(15,700),TEAL,'center');}
 // ZMP / center of pressure
 const cop=x+Math.sin(ph*Math.PI*2*2)*40;
 circle(cop,ground+5,9,RED,2,RED);
 line(cop,ground+5,cop,ground-40,RED,1.6);
 txt('CENTER OF PRESSURE',cop,ground+96,MONO(15,700),RED,'center');
 // COM projection
 const comx=x+Math.sin(ph*Math.PI*2)*12;
 g.setLineDash([4,6]);line(comx,fig[2]-170,comx,ground,GRAY,1.4);g.setLineDash([]);
 txt('CoM',comx+14,fig[2]-160,MONO(15,600),GRAY);
 txt('swing',x+330,430,MONO(17,500),GRAY);
 txt('stance',x-380,700,MONO(17,500),GRAY);
 const stn=['STAND','PUSH','FALL-FORWARD','CATCH','REPEAT'];
 const k=Math.floor(gt*1.1)%stn.length;
 frame(140,220,330,70,'','',AMBER);txt(stn[k],300,268,MONO(21,700),AMBER,'center');
}

  if(i===3){g.strokeRect(x+100,y+120,260,90);circle(x+150,y+228,26,GRAY,3);circle(x+310,y+228,26,GRAY,3);line(x+100,y+120,x+180,y+60,GRAY,3);line(x+180,y+60,x+300,y+60,GRAY,3);line(x+300,y+60,x+360,y+120,GRAY,3);}
  txt(c[0]==='STAIRS'?'built for legs':c[0]==='DOORS'?'built for hands':c[0]==='TOOLS'?'built for grip':'built for bodies',x+420,y+170,MONO(21,500),WHITE);
  g.globalAlpha=1;
 });

function simScene(st,gt){
 frame(140,220,1050,660,'SIMULATION — 4,096 parallel bodies','訓練',TEAL);
 let done=0;
 for(let r=0;r<8;r++)for(let c=0;c<16;c++){

  line(0,0,-6,20,col,2.4);line(0,0,6,20,col,2.4);

 }

 txt('falls so far: '+(4000+falls).toLocaleString('en-US'),200,840,MONO(20,600),RED);
 txt('cost per fall: $0.00',700,840,MONO(20,600),TEAL);

 frame(1300,220,480,660,'TRANSFER','実機',AMBER);

 g.globalAlpha=ok;
 humanoidFig(1540,780,gt*0.4,0.9,WHITE);
 g.globalAlpha=1;
 txt('domain randomization:',1320,300,MONO(17,700),AMBER);
 txt('random mass · friction · pushes',1320,336,MONO(16,500),GRAY);
 txt('so reality is just one more variant',1320,366,MONO(16,500),GRAY);
 if(blink(gt,1)>.5&&st>9)txt('POLICY DEPLOYED',1540,240,MONO(16,700),TEAL,'center');
